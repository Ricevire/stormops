global:
  resolve_timeout: 5m

# 降噪策略说明：
#   1. group_by 用 alertname + host —— 同一台机器的同一类问题合并成一条，
#      避免"CPU 高 + 负载高 + 磁盘慢"同时炸出 6 条告警淹没值班群；
#   2. critical 会抑制同主机的 warning（inhibit_rules），
#      主机都挂了还提示"磁盘 86%"是没有意义的噪音；
#   3. 没有配置真实外发通道时，receiver 为空实现，告警只在 UI 里可见。
route:
  receiver: devnull
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: devnull
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [host]

receivers:
  # 空 receiver：不接任何通知渠道，仅保留告警状态与去重逻辑。
  # 接入飞书时把 webhook_configs 填进来即可，路由配置不用改。
  - name: devnull
